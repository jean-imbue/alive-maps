[app]
name = "alive-maps"
version = "0.1.0"
description = "Walking routes that favor greenery, views, and street life within your extra-time budget."

[runtime.container]
image = "Dockerfile"
port = 8080

[routing]
health_check = "/health"
# The whole app is open to anyone with the link, no sign-in.
public_paths = ["/"]

[resources]
memory_mb = 512
cpu_cores = 0.5

[data]
app_data = true
